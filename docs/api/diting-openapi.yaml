          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_HealthData_'
  /api/v1/instruments/search:
    get:
      tags:
      - v1
      summary: Search Instruments
      operationId: search_instruments_api_v1_instruments_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 80
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_InstrumentSearchData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/stocks/{symbol}:
    get:
      tags:
      - v1
      summary: Get Stock
      operationId: get_stock_api_v1_stocks__symbol__get
      parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d{6}$
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_QuoteData_'
        '422':
          description: Validation Error
