components:
  schemas:
    AnalysisCreateRequest:
      properties:
        symbol:
          type: string
          pattern: ^\d{6}$
          title: Symbol
        profile:
          $ref: '#/components/schemas/AnalysisProfile'
          default: standard
        force_refresh:
          type: boolean
          title: Force Refresh
          default: false
        requested_engines:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Requested Engines
        deadline_seconds:
          type: integer
          maximum: 900.0
          minimum: 30.0
          title: Deadline Seconds
          default: 300
      additionalProperties: false
      type: object
      required:
      - symbol
      title: AnalysisCreateRequest
    AnalysisProfile:
      type: string
      enum:
      - standard
      - deep
      title: AnalysisProfile
    AnalysisRunView:
      properties:
        run_id:
          type: string
          title: Run Id
        symbol:
          type: string
          title: Symbol
        profile:
          type: string
          title: Profile
        status:
          type: string
          title: Status
        snapshot_id:
          type: string
          title: Snapshot Id
        snapshot_hash:
          type: string
          title: Snapshot Hash
        config_hash:
          type: string
          title: Config Hash
        strategy_version:
          type: string
          title: Strategy Version
        code_version:
          type: string
          title: Code Version
        started_at:
          type: string
          format: date-time
          title: Started At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        engine_runs:
          items:
            $ref: '#/components/schemas/EngineRunView'
          type: array
          title: Engine Runs
        consensus:
          anyOf:
          - $ref: '#/components/schemas/ConsensusView'
          - type: 'null'
        verdict:
          anyOf:
          - $ref: '#/components/schemas/VerdictView'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - run_id
      - symbol
      - profile
      - status
      - snapshot_id
      - snapshot_hash
      - config_hash
      - strategy_version
      - code_version
      - started_at
      - completed_at
      - engine_runs
      title: AnalysisRunView
    ApiEnvelope_AnalysisRunView_:
      properties:
        api_version:
          type: string
          const: '1.0'
          title: Api Version
          default: '1.0'
        request_id:
          type: string
          title: Request Id
        server_time:
          type: string
          format: date-time
          title: Server Time
        data:
          anyOf:
          - $ref: '#/components/schemas/AnalysisRunView'
          - type: 'null'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorInfo'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - request_id
      - server_time
      - data
      - meta
      title: ApiEnvelope[AnalysisRunView]
