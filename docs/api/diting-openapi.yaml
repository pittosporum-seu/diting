openapi: 3.1.0
info:
  title: 谛听
  description: Diting v0.8 typed API. FastAPI serves /api/v1/* internally; the production gateway exposes the same routes
    at /api/diting/v1/*.
  version: 0.8.0
paths:
  /api/v1/auth/session:
    get:
      tags:
      - auth
      summary: Session Status
      operationId: session_status_api_v1_auth_session_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_AuthSessionData_'
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_AuthSessionData_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - auth
      summary: Logout
      operationId: logout_api_v1_auth_session_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope_AuthSessionData_'
  /api/v1/health:
    get:
      tags:
      - v1
