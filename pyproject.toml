[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diting"
version = "0.1.0"
description = "谛听 · A股多模型AI投资分析工具"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "孙海桐", email = "sunhaitong123@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["stock", "investment", "a-share", "china", "wyckoff", "buffett"]
dependencies = [
    "litellm==1.90.3",
    "mcpaisuite-sandboxmcp==1.1.0",
    "click==8.4.2",
    "structlog==26.1.0",
    "requests==2.34.2",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "numpy==2.5.0",
    "scipy==1.18.0",
    "vmdpy==0.2",
    "PyWavelets==1.9.0",
    "pyyaml==6.0.3",
    "akshare==1.18.64",
    "emd-signal==1.9.0",
    "eltdx==1.0.2",
    "fastapi==0.139.0",
    "uvicorn==0.49.0",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]

[project.scripts]
diting = "diting.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/diting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "playwright==1.61.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]
