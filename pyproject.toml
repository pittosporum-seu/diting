[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diting"
version = "0.7.1"
description = "谛听 · A股多模型AI投资分析工具"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "孙海桐", email = "sunhaitong123@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["stock", "investment", "a-share", "china", "wyckoff", "buffett"]
dependencies = [
    "litellm>=1.50.0",
    "mcpaisuite-sandboxmcp>=1.0.2",
    "click>=8.1.0",
    "structlog>=24.0.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "vmdpy>=0.2",
    "PyWavelets>=1.7.0",
    "pyemd>=0.4.0",
    "pyyaml>=6.0",
    "akshare>=1.18.64",
    "emd-signal>=1.9.0",
    "eltdx>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
diting = "diting.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/diting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
