[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diting"
version = "0.1.0"
description = "谛听 · A股多模型AI投资分析工具"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "小爪 · 谛听项目组" }]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50.0",
    "mcpaisuite-sandboxmcp",
    "click>=8.1.0",
    "structlog>=24.0.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "vmdpy>=0.2",
    "PyWavelets>=1.7.0",
    "PyEMD>=0.4.0",
    "pyyaml>=6.0",
    "akshare>=1.18.64",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
diting = "diting.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/diting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
