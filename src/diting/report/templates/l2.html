<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谛听 · {{TITLE}}</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #374151;
    --muted: #6b7280;
    --primary: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
  header {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header h1 { font-size: 24px; font-weight: 700; }
  header .time { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .overview-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-box {
    flex: 1 1 140px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
  }
  .stat-box .num { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-box .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .symbol-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .symbol-name { font-size: 18px; font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .badge-strong_buy { background: var(--green); }
  .badge-buy { background: #84cc16; }
  .badge-accumulate { background: var(--orange); }
  .badge-hold { background: #9ca3af; }
  .badge-reduce { background: #f97316; }
  .badge-sell { background: var(--red); }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .risk-item {
    font-size: 13px;
    padding: 4px 0;
    color: var(--red);
  }
  .risk-item::before { content: "⚠ "; }
  .narrative { font-size: 14px; color: var(--text); margin: 8px 0; }
  .conclusion { padding: 16px 0; }
  .conclusion h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .conclusion p { font-size: 14px; color: var(--muted); }
  footer {
    text-align: center;
    padding: 24px 0;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 24px;
  }

  @media (min-width: 768px) {
    .container { padding: 32px 24px; }
    header h1 { font-size: 28px; }
  }
  @media (max-width: 480px) {
    .container { padding: 16px 12px; }
    .card { padding: 14px; }
    .symbol-name { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="container">

<header>
  <h1>谛听 · 深度分析报告</h1>
  <div class="time">{{TIMESTAMP}}</div>
</header>

<div class="overview-stats">
  {{OVERVIEW_STATS}}
</div>

{{SYMBOLS_DETAIL}}

<div class="card">
  <div class="section-title">持仓概览</div>
  {{HOLDINGS_CHART}}
</div>

<div class="card">
  <div class="section-title">风险清单</div>
  {{RISK_LIST}}
</div>

<div class="conclusion">
  <h2>结论</h2>
  <p>{{CONCLUSION}}</p>
</div>

<footer>
  谛听 Diting · 多模型AI投资分析 · 仅供参考，不构成投资建议
</footer>

</div>
</body>
</html>
