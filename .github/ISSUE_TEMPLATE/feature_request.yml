name: Feature Request
description: 提议一个新功能或改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提议！请填写以下信息，帮助我们评估和规划新功能。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能解决什么痛点？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: 你希望怎么实现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 有没有考虑过其他方案？

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - CLI
        - Web UI
        - 数据层
        - 信号处理
        - 分析引擎
        - 报告/推送
        - 基础设施
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 参考链接、设计草图等
