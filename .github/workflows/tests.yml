# Tests 子 workflow
# 核心测试（非网络）为必过门禁；网络测试单独跑，允许偶发失败不阻塞。

name: Tests

on:
  workflow_call:

jobs:
  # Contract and repository surfaces: all are part of one release.
  contract-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Verify FastAPI OpenAPI contract
        run: uv run python scripts/validate-api.py --check
      - name: Check every frontend JavaScript file
        run: find frontend -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check deployment and operations shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

  # 核心测试：不依赖外部网络，必须通过
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Run core tests (no network)
        run: uv run pytest tests/ -m "not network" -v --tb=short

  # Real browser contract: separate install and deterministic local HTTP fixtures.
  playwright-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Install pinned Chromium and operating-system dependencies
        run: uv run playwright install --with-deps chromium
      - name: Run real Chromium journeys
        run: uv run pytest browser_tests/ -q
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: browser-artifacts/
          if-no-files-found: ignore

  # 网络测试：依赖 ashare/腾讯等外部源，偶发失败不阻塞主门禁
  pytest-network:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Run network tests (allowed to be flaky)
        run: uv run pytest tests/ -m "network" -v --tb=short
