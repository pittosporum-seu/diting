# CI 中心编排
# 检测变更区域，调度子 workflow，聚合结果

name: CI

on:
  push:
    branches: [main, master, verify]
  pull_request:
    branches: [main, master, verify]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 变更分类 ─────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            workflows:
              - '.github/workflows/**'

  # ── Lint ─────────────────────────────────────────────────
  lint:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.workflows == 'true'
    uses: ./.github/workflows/lint.yml

  # ── Tests ────────────────────────────────────────────────
  tests:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.workflows == 'true'
    uses: ./.github/workflows/tests.yml

  # ── Lockfile 同步检查 ───────────────────────────────────
  lockfile-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    uses: ./.github/workflows/uv-lockfile-check.yml

  # ── 聚合门禁 ─────────────────────────────────────────────
  all-checks-pass:
    if: always()
    needs: [lint, tests, lockfile-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] ||
             [[ "${{ needs.tests.result }}" == "failure" ]] ||
             [[ "${{ needs.lockfile-check.result }}" == "failure" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          # skipped jobs are OK (e.g. no Python changes)
          echo "All checks passed or skipped"
