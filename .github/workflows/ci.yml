name: CI

on:
  push:
    branches: [main, master, verify]
  pull_request:
    branches: [main, master, verify]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# v0.8 intentionally has no path filter. Python, frontend, configuration,
# contracts, strategy research, deployment scripts and workflows share one
# release and must not bypass the required gates.
jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  lockfile-check:
    uses: ./.github/workflows/uv-lockfile-check.yml

  all-checks-pass:
    if: always()
    needs: [lint, tests, lockfile-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          LOCK_RESULT: ${{ needs.lockfile-check.result }}
        run: |
          for result in "$LINT_RESULT" "$TEST_RESULT" "$LOCK_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI job did not succeed: $result"
              exit 1
            fi
          done
          echo "All required CI jobs passed"
