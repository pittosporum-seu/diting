<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谛听 · A股多模型AI投资分析</title>
  <link rel="stylesheet" href="css/styles.css?v=0.7.1">
  <link rel="stylesheet" href="css/freshness.css?v=0.7.1">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <!-- v0.7.1 P1-4: 前端拆分为多文件模块，按依赖顺序加载 -->
  <script type="module" src="js/cache.js?v=0.7.1"></script>
  <script type="module" src="js/api.js?v=0.7.1"></script>
  <script type="module" src="js/charts.js?v=0.7.1"></script>
  <script type="module" src="js/ui.js?v=0.7.1"></script>
  <script type="module" src="js/pages/dashboard.js?v=0.7.1"></script>
  <script type="module" src="js/pages/stock.js?v=0.7.1"></script>
  <script type="module" src="js/pages/opportunities.js?v=0.7.1"></script>
  <script type="module" src="js/pages/watchlist.js?v=0.7.1"></script>
  <script type="module" src="js/pages/settings.js?v=0.7.1"></script>
  <script type="module" src="js/router.js?v=0.7.1"></script>
  <script type="module" src="js/app.js?v=0.7.1"></script>
</head>
<body>
  <nav id="navbar">
    <a href="#/dashboard" class="nav-logo">🐾 谛听</a>
    <div class="nav-links">
      <a href="#/dashboard" class="nav-link" data-route="dashboard">仪表盘</a>
      <a href="#/stock" class="nav-link" data-route="stock_landing">个股分析</a>
      <a href="#/opportunities" class="nav-link" data-route="opportunities">选股机会</a>
      <a href="#/watchlist" class="nav-link" data-route="watchlist">自选股</a>
      <a href="#/settings" class="nav-link" data-route="settings">设置</a>
    </div>
  </nav>
  <main id="app-root"><p style="color:var(--text-secondary);text-align:center;padding:40px">加载中…</p></main>
  <!-- 诊断：如果此文本一直显示，说明 JS 模块加载失败 -->
  <!-- 如果完全空白（连"加载中"都看不到），说明浏览器缓存了旧页面 -->
  <noscript><div style="text-align:center;padding:40px;color:red">需要启用 JavaScript</div></noscript>
  <script>
    // v0.7.2 诊断：捕获模块加载错误
    var diag = document.getElementById('app-root');
    function diagMsg(msg) {
      if (diag) diag.innerHTML = '<div style=\"padding:20px;color:#e17055\">🐾 谛听 · ' + msg + '<br><small style=\"color:#999\">' + new Date().toISOString() + '</small></div>';
    }
    diagMsg('加载中…');
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT') {
        diagMsg('模块加载失败: ' + (e.target.src || 'inline'));
      }
    }, true);
    // 5秒后还在加载中 = 模块没执行完
    setTimeout(function() {
      var el = document.getElementById('app-root');
      if (el && el.textContent.indexOf('加载中') >= 0) {
        el.innerHTML = '<div style=\"padding:20px;color:#e17055\">⚠️ 模块加载超时<br><small style=\"color:#999\">请检查浏览器控制台错误</small></div>';
      }
    }, 8000);
  </script>
</body>
</html>
