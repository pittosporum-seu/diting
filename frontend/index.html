<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谛听 · A股多模型AI投资分析</title>
  <link rel="stylesheet" href="css/styles.css?v=0.7.1">
  <link rel="stylesheet" href="css/freshness.css?v=0.7.1">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <!-- v0.7.2: core.js 必须在所有业务模块之前加载，避免循环依赖 -->
  <script type="module" src="js/core.js?v=0.7.2"></script>
  <script type="module" src="js/cache.js?v=0.7.2"></script>
  <script type="module" src="js/api.js?v=0.7.2"></script>
  <script type="module" src="js/charts.js?v=0.7.2"></script>
  <script type="module" src="js/ui.js?v=0.7.2"></script>
  <script type="module" src="js/pages/dashboard.js?v=0.7.2"></script>
  <script type="module" src="js/pages/stock.js?v=0.7.2"></script>
  <script type="module" src="js/pages/opportunities.js?v=0.7.2"></script>
  <script type="module" src="js/pages/watchlist.js?v=0.7.2"></script>
  <script type="module" src="js/pages/settings.js?v=0.7.2"></script>
  <script type="module" src="js/router.js?v=0.7.2"></script>
  <script type="module" src="js/app.js?v=0.7.2"></script>
</head>
<body>
  <nav id="navbar">
    <a href="#/dashboard" class="nav-logo">🐾 谛听</a>
    <div class="nav-links">
      <a href="#/dashboard" class="nav-link" data-route="dashboard">仪表盘</a>
      <a href="#/stock" class="nav-link" data-route="stock_landing">个股分析</a>
      <a href="#/opportunities" class="nav-link" data-route="opportunities">选股机会</a>
      <a href="#/watchlist" class="nav-link" data-route="watchlist">自选股</a>
      <a href="#/settings" class="nav-link" data-route="settings">设置</a>
    </div>
  </nav>
  <main id="app-root"><p style="color:var(--text-secondary);text-align:center;padding:40px">加载中…</p></main>
  <!-- 铁证诊断：内联脚本，不依赖任何模块 -->
  <script>
    var _diag = document.getElementById('app-root');
    var _start = Date.now();
    _diag.innerHTML = '<p style="text-align:center;padding:40px">🐾 谛听 v0.7.2 · 启动中…<br><small id="_diag_time"></small></p>';
    setInterval(function(){ document.getElementById('_diag_time').textContent = '已等待 ' + Math.floor((Date.now()-_start)/1000) + ' 秒'; }, 1000);
    // 如果 renderPage 被调用了，它会清空 app-root 并写入页面内容
    // 如果这里一直在，说明模块从未执行
  </script>
  <noscript><div style="text-align:center;padding:40px;color:red">需要启用 JavaScript</div></noscript>
</body>
</html>
