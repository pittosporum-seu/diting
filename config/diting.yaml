# 谛听 v0.8.0 主配置。密钥只允许通过环境变量注入。

runtime:
  environment: development
  public_readonly: false
  log_level: WARNING

database:
  business_path: diting.db
  cache_path: diting_cache.db

providers:
  - name: ashare
    priority: 20
  - name: mx_data
    priority: 30
    requires_key: MX_APIKEY
    settings:
      max_batch: 4
  - name: akshare
    priority: 40

engines:
  default: [technical, volume_profile, wyckoff, can_slim]
  deep: [technical, volume_profile, wyckoff, can_slim, buffett]
  weights:
    technical: 1.0
    volume_profile: 0.8
    wyckoff: 0.8
    can_slim: 0.7
    buffett: 0.7
    vmd_rsi: 0.0
  scoring:
    threshold: [80, 65, 50, 35, 20]

context:
  providers: [price_basic, vmd_cycle_state]
  vmd_cycle_state:
    k: 8
    alpha: 2000
    window: 250
    tol: 1e-5

indicators:
  rsi: {period: 14, oversold: 30, overbought: 75}
  macd: {fast: 12, slow: 26, signal: 9}
  kdj: {period: 9, k_smooth: 3, d_smooth: 3}
  bollinger: {period: 20, std_dev: 2.0}
  vmd: {k: 6, alpha: 2000, min_window: 60, trough: 0.3, peak: 0.7}
  ma: [5, 20, 60]

pipeline:
  max_workers: 4
  llm_concurrent: 2
  scan_concurrent: 1
  queue_limit: 100
  timeout_per_engine: 60
  fail_fast: false
  ai_batch_size: 15
  deep_concurrent: 4
  cache:
    realtime_ttl: 30
    historical_ttl: 300
    max_size: 512
  logging: WARNING

report:
  level: L2
  theme: light
  output_dir: output
  charts: {width: 800, height: 400}

notify:
  default_channel: local
  channels:
    feishu: {enabled: false, settings: {}}
    email: {enabled: false, settings: {}}

prefetch:
  analysis:
    enabled: true
    idle_hour: 18
    batch_size: 3
    stock_delay: 3
    batch_delay: 20
    max_stocks: 30
    signal_threshold: 65

strategy:
  selected: mean_reversion_v1
  require_active: true
