# config/diting.yaml — 谛听主配置文件
# 此文件不存在时所有模块使用代码默认值

# ── 数据源降级链 ──────────────────────────────────

providers:
  - name: ashare         # 新浪/腾讯免费数据
    priority: 20
    auto_detect: false
  - name: mx_data        # 东方财富（需 API Key）
    priority: 30
    requires_key: MX_APIKEY
    settings:
      max_batch: 4       # 每批最多查 4 只
  - name: akshare        # 兜底（慢但全）
    priority: 40
    auto_detect: false

# ── 引擎选择 + 权重 ────────────────────────────────

engines:
  default:               # 默认启用哪些引擎（按顺序）
    - verdict            # 结论翻译（必选）
    - vmd_rsi            # VMD+RSI 择时
    - volume_profile     # 成交量分布
    # - wyckoff          # 以下需 AI，当前不可用时自动跳过
    # - buffett
    # - can_slim

  weights:
    vmd_rsi: 1.2
    verdict: 1.0
    volume_profile: 0.8
    wyckoff: 0.6
    buffett: 0.6
    can_slim: 0.5

  scoring:
    threshold: [80, 65, 50, 35, 20]  # strong_buy/buy/accumulate/hold/reduce

# ── 技术指标参数 ──────────────────────────────────

indicators:
  rsi:      {period: 14, oversold: 30, overbought: 75}
  macd:     {fast: 12, slow: 26, signal: 9}
  kdj:      {period: 9, k_smooth: 3, d_smooth: 3}
  bollinger: {period: 20, std_dev: 2.0}
  vmd:      {k: 6, alpha: 2000, min_window: 60, trough: 0.3, peak: 0.7}
  ma:       [5, 20, 60]

# ── 管道运行参数 ──────────────────────────────────

pipeline:
  max_workers: 4
  timeout_per_engine: 60   # 秒
  fail_fast: false

  cache:
    realtime_ttl: 300      # 实时行情缓存 5 分钟
    historical_ttl: 3600   # 历史行情缓存 1 小时
    max_size: 512

  logging: WARNING

# ── 报告配置 ──────────────────────────────────────

report:
  level: L2
  theme: light
  output_dir: ./output/
  charts: {width: 800, height: 400}

# ── 通知通道 ──────────────────────────────────────

notify:
  default_channel: local
  channels:
    feishu:
      enabled: false
      settings: {}
    email:
      enabled: false
      settings: {}
